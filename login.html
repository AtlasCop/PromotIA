<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Promot IA</title>
<meta name="description" content="Inicia sesión en Promot IA como empresa o como proveedor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  :root{
    --ink:#0d1526; --paper:#f6f8fc; --paper-raised:#ffffff; --muted:#5b6478; --line:#dde3f0;
    --cyan:#18b8dd; --blue:#3b6cf4; --violet:#7c3aed; --accent-soft:#eaf0ff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e9edf7; --paper:#0b1220; --paper-raised:#111a2e;
      --muted:#93a1c2; --line:#243050; --accent-soft:#182238;
      --cyan:#3fd2f2; --blue:#6f92ff; --violet:#a685f7;
    }
  }
  *{box-sizing:border-box;}
  html,body{background:var(--paper); min-height:100%;}
  body{color:var(--ink); font-family:'Source Sans 3', ui-sans-serif, system-ui, sans-serif;}
  h1,.brand-word{font-family:'Sora', ui-sans-serif, system-ui, sans-serif;}
  .grad-text{
    background:linear-gradient(90deg,var(--cyan),var(--blue) 55%,var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .btn-primary{background:linear-gradient(90deg,var(--blue),var(--violet)); box-shadow:0 12px 28px -12px rgba(59,108,244,.55);}
  .btn-primary:hover{filter:brightness(1.08);}

  .auth-card{background:var(--paper-raised); border:1.5px solid var(--line); border-radius:20px; box-shadow:0 20px 50px -24px rgba(16,23,41,.25);}

  .role-btn{
    flex:1; padding:12px 14px; border-radius:12px; font-weight:600; font-size:14px;
    border:1.5px solid var(--line); color:var(--muted); background:var(--paper); transition:all .15s; cursor:pointer;
  }
  .role-btn.active{border-color:transparent; color:#fff; background:linear-gradient(90deg,var(--blue),var(--violet));}

  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px;}
  .field input{
    width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:14.5px; font-family:'Source Sans 3',sans-serif;
  }
  .field input:focus{outline:none; border-color:var(--blue);}
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:42px;}
  .password-toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none;
    padding:6px; cursor:pointer; color:var(--muted); display:flex; align-items:center;
  }
  .password-toggle:hover{color:var(--ink);}
  /* El navegador fuerza un fondo (ej. amarillo) al autocompletar — lo forzamos de vuelta al de la página. */
  .field input:-webkit-autofill,
  .field input:-webkit-autofill:hover,
  .field input:-webkit-autofill:focus{
    -webkit-box-shadow:0 0 0 1000px var(--paper) inset;
    -webkit-text-fill-color:var(--ink);
    transition:background-color 9999s ease-in-out 0s;
  }

  #tipoSubtitle[data-tipo="proveedor"] .txt-empresa{display:none;}
  #tipoSubtitle[data-tipo="empresa"] .txt-proveedor{display:none;}
</style>
</head>
<body class="antialiased">

  <div class="min-h-screen flex flex-col items-center justify-center px-6 py-12">

    <a href="landing/index.html" class="flex items-center gap-2.5 mb-8">
      <svg viewBox="0 0 40 40" fill="none" class="w-8 h-8">
        <circle cx="14" cy="9" r="3.2" fill="#3fd2f2"/><circle cx="5" cy="17" r="3.2" fill="#18b8dd"/>
        <circle cx="23" cy="20" r="3.2" fill="#3b6cf4"/><circle cx="23" cy="30" r="3.2" fill="#7c3aed"/>
        <circle cx="12" cy="26" r="3.2" fill="#7c3aed"/><circle cx="14" cy="35" r="3.2" fill="#7c3aed"/>
        <g stroke="url(#navgrad)" stroke-width="1.4">
          <line x1="14" y1="9" x2="5" y2="17"/><line x1="14" y1="9" x2="23" y2="20"/>
          <line x1="5" y1="17" x2="23" y2="20"/><line x1="5" y1="17" x2="12" y2="26"/>
          <line x1="23" y1="20" x2="23" y2="30"/><line x1="23" y1="20" x2="12" y2="26"/>
          <line x1="12" y1="26" x2="23" y2="30"/><line x1="12" y1="26" x2="14" y2="35"/>
          <line x1="23" y1="30" x2="14" y2="35"/>
        </g>
        <defs><linearGradient id="navgrad" x1="0" y1="0" x2="40" y2="40">
          <stop offset="0" stop-color="#3fd2f2"/><stop offset="1" stop-color="#7c3aed"/>
        </linearGradient></defs>
      </svg>
      <span class="brand-word font-bold text-[17px]">Promot<span class="grad-text">IA</span></span>
    </a>

    <div class="auth-card w-full max-w-[400px] p-7 sm:p-8">
      <h1 class="text-[21px] font-extrabold text-center mb-1">Inicia sesión</h1>
      <p id="tipoSubtitle" data-tipo="empresa" class="text-[13.5px] text-center mb-6" style="color:var(--muted)">
        <span class="txt-empresa">Publica necesidades y descubre oportunidades de negocio.</span>
        <span class="txt-proveedor">Descubre oportunidades de negocio para tu empresa.</span>
      </p>

      <div class="flex gap-3 mb-6">
        <button type="button" id="tabEmpresa" class="role-btn active">Soy una empresa</button>
        <button type="button" id="tabProveedor" class="role-btn">Soy un proveedor</button>
      </div>

      <form id="loginForm" class="space-y-4">
        <div class="field">
          <label for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" required placeholder="nombre@empresa.com">
        </div>
        <div class="field">
          <label for="loginPassword">Contraseña</label>
          <div class="password-wrap">
            <input type="password" id="loginPassword" required placeholder="••••••••">
            <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Mostrar contraseña">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A9.7 9.7 0 0 1 12 4c7 0 11 8 11 8a20.4 20.4 0 0 1-2.16 3.19m-6.7-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div class="text-right">
          <a href="#" class="text-[13px] font-medium" style="color:var(--blue)">¿Olvidaste tu contraseña?</a>
        </div>
        <p id="loginError" class="text-[13.5px] text-center" style="color:#dc2626" hidden></p>
        <button type="submit" id="loginSubmit" class="btn-primary w-full text-white font-semibold text-[15px] px-6 py-3 rounded-xl transition">
          Iniciar sesión
        </button>
      </form>

      <p class="text-[13.5px] text-center mt-6" style="color:var(--muted)">
        ¿No tienes cuenta?
        <a href="registro.html" class="font-semibold" style="color:var(--blue)">Regístrate</a>
      </p>
    </div>

  </div>

<script>
  var tabEmpresa = document.getElementById('tabEmpresa');
  var tabProveedor = document.getElementById('tabProveedor');
  var tipoSubtitle = document.getElementById('tipoSubtitle');
  var loginForm = document.getElementById('loginForm');
  var tipoActivo = 'empresa';

  function setTipo(tipo){
    tipoActivo = tipo;
    tabEmpresa.classList.toggle('active', tipo === 'empresa');
    tabProveedor.classList.toggle('active', tipo === 'proveedor');
    tipoSubtitle.setAttribute('data-tipo', tipo);
  }
  tabEmpresa.addEventListener('click', function(){ setTipo('empresa'); });
  tabProveedor.addEventListener('click', function(){ setTipo('proveedor'); });

  document.querySelectorAll('.password-toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      var input = document.getElementById(btn.getAttribute('data-target'));
      var mostrando = input.type === 'text';
      input.type = mostrando ? 'password' : 'text';
      btn.querySelector('.icon-eye').hidden = !mostrando;
      btn.querySelector('.icon-eye-off').hidden = mostrando;
      btn.setAttribute('aria-label', mostrando ? 'Mostrar contraseña' : 'Ocultar contraseña');
    });
  });

  var loginSubmit = document.getElementById('loginSubmit');
  var loginError = document.getElementById('loginError');

  var MENSAJES_ERROR = {
    'Invalid login credentials': 'Correo o contraseña incorrectos.',
    'Email not confirmed': 'Todavía no confirmaste tu correo — revisa tu bandeja de entrada (y spam) y haz click en el enlace de confirmación antes de iniciar sesión.'
  };

  // Con la confirmación de correo activada, no hay sesión en el momento del
  // registro para crear perfiles_demandante/perfiles_oferente — quedó guardado
  // en los metadatos de la cuenta (registro.html) y se completa aquí, la
  // primera vez que hay sesión real.
  async function completarPerfilSiFalta(user){
    var meta = user.user_metadata || {};
    var rol = meta.registro_rol;
    if(!rol) return; // cuentas creadas antes de este cambio: no hay nada que completar

    if(rol === 'demandante'){
      var existente = await supabaseClient.from('perfiles_demandante').select('perfil_id').eq('perfil_id', user.id).maybeSingle();
      if(!existente.data){
        await supabaseClient.from('perfiles_demandante').insert({
          perfil_id: user.id,
          tipo_cliente: meta.d_tipo_cliente || 'persona',
          ciudad: meta.d_ciudad || null,
          sector_economico: meta.d_sector || null
        });
      }
    } else if(rol === 'oferente'){
      var existenteOf = await supabaseClient.from('perfiles_oferente').select('oferente_id').eq('oferente_id', user.id).maybeSingle();
      if(!existenteOf.data){
        var especialidadesIds = [];
        if(meta.o_especialidades && meta.o_especialidades.length){
          var resInd = await supabaseClient.from('industrias').select('id, nombre').in('nombre', meta.o_especialidades);
          especialidadesIds = (resInd.data || []).map(function(i){ return i.id; });
        }
        await supabaseClient.from('perfiles_oferente').insert({
          oferente_id: user.id,
          nombre_empresa: meta.o_nombre_empresa || null,
          nit: meta.o_nit || null,
          experiencia_anios: meta.o_experiencia ? Number(meta.o_experiencia) : null,
          correo_contacto: meta.o_correo_contacto || null,
          especialidades: especialidadesIds,
          ciudades_operacion: meta.o_ciudades || [],
          certificaciones: meta.o_certificaciones || [],
          tamano_empresa: meta.o_empleados || null,
          sitio_web: meta.o_web || null,
          portafolio_url: meta.o_portafolio || null
        });
      }
    }
  }

  async function irADashboard(user){
    await completarPerfilSiFalta(user);
    // Quién puede ver las dos pestañas (Demandante/Empresa) ya no depende de
    // tipo_cuenta sino de si la cuenta realmente tiene un perfil de oferente:
    // quien solo se registró para publicar una necesidad no debe ver ni poder
    // pasar a la vista de empresa — para eso hay que registrarse como empresa.
    var tieneOferente = await supabaseClient.from('perfiles_oferente').select('oferente_id').eq('oferente_id', user.id).maybeSingle();
    var tipoReal = tieneOferente.data ? 'empresa' : 'demandante';
    window.location.href = 'app/dashboard.html?tipo=' + tipoReal;
  }

  // Si se llega aquí con una sesión ya activa (ej. justo después de confirmar
  // el correo, que deja logueado automáticamente vía el link de confirmación),
  // saltar el formulario y entrar directo — no tiene sentido pedir de nuevo
  // correo/contraseña si ya hay sesión.
  (async function revisarSesionExistente(){
    var sesion = await supabaseClient.auth.getSession();
    if(sesion.data.session){
      await irADashboard(sesion.data.session.user);
    }
  })();

  loginForm.addEventListener('submit', async function(e){
    e.preventDefault();
    loginError.hidden = true;

    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;

    loginSubmit.disabled = true;
    loginSubmit.textContent = 'Ingresando...';

    var resultado = await supabaseClient.auth.signInWithPassword({ email: email, password: password });

    if(resultado.error){
      loginSubmit.disabled = false;
      loginSubmit.textContent = 'Iniciar sesión';
      loginError.textContent = MENSAJES_ERROR[resultado.error.message] || resultado.error.message;
      loginError.hidden = false;
      return;
    }

    await irADashboard(resultado.data.user);
  });
</script>
</body>
</html>
